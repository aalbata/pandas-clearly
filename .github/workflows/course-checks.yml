name: Check course
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pandas: ['2.2.3', '3.0.6']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tested dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install pandas==${{ matrix.pandas }}
      - name: Execute examples and solutions independently
        run: python scripts/validate.py --write-outputs
      - name: Build pages and notebooks
        run: python scripts/build.py
      - name: Check links, attribution, and notebook structure
        run: python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: validation-pandas-${{ matrix.pandas }}
          path: validation/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook verification dependency
        run: python -m pip install openpyxl==3.1.5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify real browser Python and lesson controls
        run: npm run test:browser
      - name: Verify downloads, saved work, and runtime recovery
        run: npm run test:interactions
      - name: Verify interactive table walkthroughs
        run: npm run test:visuals
      - uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: validation/browser*.json
